<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jewelry Sales Chatbot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="chat-app">
        <!-- Topbar -->
        <header class="topbar">
            <div class="topbar-content">
                <h1 class="topbar-title">💎 Jewelry Sales AI</h1>
                <p class="topbar-subtitle">Tanya penjualan perhiasan dengan bahasa alami</p>
            </div>
            <button class="btn-icon" id="btnNewChat" aria-label="New chat" onclick="handleNewChat()">
                🔄
            </button>
        </header>

        <!-- Chat Container -->
        <main class="chat-container">
            <div class="messages-wrapper" id="messagesWrapper">
                <!-- Empty state akan di-inject via JS -->
            </div>
        </main>

        <!-- Composer (Input) -->
        <footer class="composer">
            <div class="composer-content">
                <textarea 
                    id="inputMessage" 
                    class="input-text"
                    placeholder="Ketik pertanyaan Anda... (Enter untuk kirim, Shift+Enter untuk baris baru)"
                    rows="1"
                ></textarea>
                <button class="btn-send" id="btnSend" aria-label="Send message" onclick="handleSend()">
                    ➤
                </button>
            </div>
            <div class="composer-hint">Enter = kirim • Shift+Enter = baris baru</div>
        </footer>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
              <button class="card" data-starter="Ringkasan penjualan per lokasi">
                <div class="card-title">Ringkasan per lokasi</div>
                <div class="card-sub">Lokasi mana paling tinggi?</div>
              </button>
              <button class="card" data-starter="Tampilkan penjualan MP000197 bulan 4 tahun 2022">
                <div class="card-title">Filter produk</div>
                <div class="card-sub">Contoh query berdasarkan kode.</div>
              </button>
              <button class="card" data-starter="Data tahun apa saja yang tersedia?">
                <div class="card-title">Cek cakupan data</div>
                <div class="card-sub">Tahun/bulan apa saja ada?</div>
              </button>
            </div>
          </div>

          <!-- Messages -->
          <div class="messages" id="messages"></div>
        </div>
      </section>

      <footer class="composer">
        <div class="container">
          <div class="composer-inner">
            <input id="input" class="input" placeholder="Tulis pertanyaan… (contoh: Ringkasan per produk)" />
            <button id="btnSend" class="send" aria-label="Kirim">➤</button>
          </div>
          <div class="micro">Enter untuk kirim • Shift+Enter untuk baris baru</div>
        </div>
      </footer>
    </main>

    <!-- Mobile sidebar overlay -->
    <div class="overlay" id="overlay"></div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
