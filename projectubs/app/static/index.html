<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jewelry Sales Chatbot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo-sidebar">
                <div class="logo-icon">💎</div>
                <span class="logo-text">Jewelry AI</span>
            </div>
        </div>

        <button class="btn-new-chat-sidebar" id="btnNewChatSidebar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 5v14M5 12h14"/>
            </svg>
            <span>Chat Baru</span>
        </button>

        <div class="chat-history">
            <div class="history-header">
                <h3>Riwayat Chat</h3>
            </div>
            <div class="history-list" id="historyList">
                <!-- History items will be injected here -->
            </div>
        </div>
    </aside>

    <!-- Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Topbar -->
        <header class="topbar">
            <button class="btn-toggle-sidebar" id="btnToggleSidebar" aria-label="Toggle sidebar">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 12h18M3 6h18M3 18h18"/>
                </svg>
            </button>
            
            <div class="topbar-content">
                <div class="topbar-text">
                    <h1 class="topbar-title">Jewelry Sales AI</h1>
                    <p class="topbar-subtitle">Asisten analisis penjualan perhiasan profesional</p>
                </div>
            </div>
        </header>

        <!-- Chat Container -->
        <main class="chat-container">
            <div class="messages-wrapper" id="messagesWrapper">
                <!-- Messages will be injected here -->
            </div>
        </main>

        <!-- Composer -->
        <footer class="composer">
            <div class="composer-content">
                <div class="input-wrapper">
                    <textarea 
                        id="inputMessage" 
                        class="input-text"
                        placeholder="Tanyakan tentang data penjualan perhiasan..."
                        rows="1"
                    ></textarea>
                </div>
                <button class="btn-send" id="btnSend" aria-label="Send message">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                    </svg>
                </button>
            </div>
            <div class="composer-hint">Tekan Enter untuk mengirim • Shift+Enter untuk baris baru</div>
        </footer>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
